<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PAMI ADMIN</title><style>
:root{--o:#F07828;--ot:#FEF2EA;--ink:#202124;--mut:#74777D;--bd:#E8E9EB;--tag:#F4F4F5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff}
main{max-width:620px;margin:auto;padding:18px 14px 60px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--mut);margin-top:5px}
button{font:inherit;color:var(--ink);-webkit-text-fill-color:var(--ink)}.add{border:0;border-radius:10px;background:var(--o);font-weight:700;padding:11px 14px;min-height:44px}
.search{width:100%;border:0;background:#f7f7f8;border-radius:10px;padding:13px;margin:18px 0 12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}.card{min-width:0}.pic{position:relative;aspect-ratio:3/4;border-radius:7px;overflow:hidden;background:#f1f1f1}.pic img{width:100%;height:100%;object-fit:cover}.check{position:absolute;right:7px;top:7px;width:24px;height:24px;border-radius:6px;background:#fff;border:1px solid #ddd;display:grid;place-items:center;color:var(--o);font-weight:900;font-size:18px}.name{font-size:11px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{font-size:8px;color:var(--mut);margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:620px;margin:auto;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 14px;font-size:18px}.field{display:block;margin:12px 0;font-size:12px;color:var(--mut)}.field input{display:block;width:100%;margin-top:5px;border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:16px;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}.field input::placeholder{color:var(--mut);-webkit-text-fill-color:var(--mut)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:9px 12px}.chip.on{background:var(--ot);border-color:transparent;font-weight:700}.actions{display:flex;gap:8px;margin-top:18px}.actions button{min-height:44px;border-radius:10px;padding:10px 14px}.cancel{background:#fff;border:1px solid var(--bd);flex:1}.save{background:var(--o);border:0;font-weight:700;flex:2}.hiddenCard{opacity:.53}.hiddenCard .pic:after{content:"非表示";position:absolute;left:5px;bottom:5px;background:#202124;color:white;border-radius:5px;padding:4px 6px;font-size:11px}.login{position:fixed;inset:0;background:#fff;z-index:30;display:grid;place-items:center;padding:20px}.login.off{display:none}.loginBox{width:100%;max-width:360px}.loginBox input{width:100%;font-size:16px;padding:13px;border:1px solid var(--bd);border-radius:10px;margin:14px 0}.loginBox button{width:100%;border:0;border-radius:10px;background:var(--o);padding:13px;font-weight:700}.logout{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px;font-size:12px}.field input[type=password]{font-family:inherit}.note{font-size:11px;color:var(--mut);line-height:1.5;margin-top:12px}
</style></head><body><main><div class="top"><div><h1>PAMI ADMIN</h1><div class="sub">衣装を追加・編集</div></div><div style="display:flex;gap:7px;align-items:center"><button class="logout" id="logout">ログアウト</button><button class="add" id="open">＋ 追加</button></div></div><input class="search" id="search" placeholder="検索"><label style="display:block;font-size:12px;margin:-3px 0 12px"><input type="checkbox" id="showHidden"> 非表示の衣装も表示</label><div class="grid" id="grid"></div></main>
<div class="login" id="login"><div class="loginBox"><h1>PAMI ADMIN</h1><p class="sub">管理用パスワードでログイン</p><form id="loginForm"><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="管理用パスワード"><button id="loginBtn" type="submit">ログイン</button></form><p class="note" id="loginNote">ログイン状態はこのタブを閉じるまで保持します。パスワードは端末に保存しません。</p></div></div><div class="sheet" id="sheet"><div class="panel"><h2 id="sheetTitle">衣装を追加</h2><label class="field">写真<input id="photo" type="file" accept="image/*"></label><label class="field">衣装名<input id="costumeName" placeholder="例：REALIZE 黒×白水着"></label><div class="field">タグ</div><div class="chips" id="chips"><button class="chip" data-tag="fullback">フルバック</button><button class="chip" data-tag="tback">Tバック</button><button class="chip" data-tag="character">キャラクター</button><button class="chip" data-tag="other">その他</button></div><label class="field" id="passwordField" style="display:none">管理用パスワード<input id="adminPassword" type="password" autocomplete="off" placeholder="Cloudflareに登録したパスワード"></label><div class="actions"><button class="cancel" id="cancel">キャンセル</button><button class="save" id="save">追加</button></div><div class="actions" id="editActions" style="display:none"><button class="cancel" id="hideBtn">非表示</button><button class="cancel" id="deleteBtn" style="color:#C62828">削除</button></div><div class="note" id="note">写真追加・差し替えにも対応します。</div></div></div>
<script>
const $=id=>document.getElementById(id); const API="https://pami-costume-api.pmzoupmzou.workers.dev"; let costumes=[],editing=null,sessionPassword="";
function get(url){return fetch(url+'?v='+Date.now()).then(r=>r.json())}
function normTags(t){return Array.isArray(t)?t:(t?[t]:[])}
function render(){let q=$('search').value.toLowerCase(),g=$('grid');g.innerHTML='';costumes.filter(c=>($('showHidden').checked||c.visible!==false)&&(!q||String(c.name||'').toLowerCase().includes(q))).forEach(c=>{let el=document.createElement('div');el.className='card'+(c.visible===false?' hiddenCard':'');el.innerHTML='<div class="pic"><img src="'+c.image+'?v='+(c.imageVersion||1)+'"><span class="check"></span></div><div class="name">'+(c.name||'')+'</div><div class="tags">'+normTags(c.tags).map(t=>({fullback:'フルバック',tback:'Tバック',character:'キャラクター',other:'その他'})[t]||t).join(' · ')+'</div>';let ck=el.querySelector('.check');ck.onclick=e=>{e.stopPropagation();ck.textContent=ck.textContent?'':'✓'};el.onclick=()=>openEdit(c);g.appendChild(el)})}
get('custom-data.json').then(x=>{costumes=x;render()});
function setChips(tags){let a=normTags(tags);document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',a.includes(b.dataset.tag)))}
function openAdd(){editing=null;$('sheetTitle').textContent='衣装を追加';$('costumeName').value='';$('photo').value='';setChips([]);$('save').textContent='追加する';$('editActions').style.display='none';$('passwordField').style.display='none';$('note').textContent='写真・名前・タグを選んで追加。番号は自動で割り当てます。';$('sheet').classList.add('on')}
function openEdit(c){editing=c;$('sheetTitle').textContent='No.'+String(c.id).padStart(3,'0')+' を編集';$('costumeName').value=String(c.name||'').replace(/^No\.\d+｜/,'');$('photo').value='';setChips(c.tags);$('save').textContent='変更を保存';$('editActions').style.display='flex';$('hideBtn').textContent=c.visible===false?'再表示':'非表示';$('passwordField').style.display='none';$('note').textContent='写真を選んだ場合は、名前・タグと一緒に「変更を保存」で差し替えます。';$('sheet').classList.add('on')}
$('search').oninput=render;$('showHidden').onchange=render;$('open').onclick=openAdd;$('cancel').onclick=()=>$('sheet').classList.remove('on');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
$('hideBtn').onclick=async()=>{if(!editing)return;const visible=editing.visible===false;if(!confirm('No.'+editing.id+' を'+(visible?'再表示':'非表示')+'にしますか？'))return;await runSave($('hideBtn'),()=>send('/visibility',{id:Number(editing.id),visible}));$('hideBtn').textContent=editing.visible===false?'再表示':'非表示';};
$('deleteBtn').onclick=()=>{$('note').textContent='削除はまだ未対応です。'};
function imageData(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('画像を選択してね'));if(file.size>20000000)return reject(Error('元画像は20MB以下にしてね'));const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const max=1400,scale=Math.min(1,max/Math.max(im.width,im.height)),canvas=document.createElement('canvas');canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height);const out=canvas.toDataURL('image/jpeg',.84);if(out.length>7500000)throw Error('画像が大きすぎます');resolve(out)}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('画像を読み込めませんでした'))};im.src=url})}
async function send(path,payload){const password=sessionPassword;if(!password)throw Error('ログインし直してね');const response=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':password},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'HTTP '+response.status);return result}
async function refresh(){costumes=await get('custom-data.json');render()}
async function runSave(button,task){button.disabled=true;const original=button.textContent;button.textContent='保存中…';$('note').textContent='GitHubへ保存しています。画面を閉じずに待ってね。';try{const result=await task();$('note').textContent='保存完了！ 公開サイトへの反映には少し時間がかかる場合があります。';button.textContent='保存済み';if(result.item){const i=costumes.findIndex(x=>Number(x.id)===Number(result.item.id));if(i>=0)costumes[i]=result.item;else costumes.push(result.item);render()}return result}catch(e){if(e.message==='Incorrect password'){sessionPassword='';$('login').classList.remove('off')} $('note').textContent='保存できませんでした：'+e.message;button.textContent=original}finally{button.disabled=false}}
$('save').onclick=async()=>{const tags=[...document.querySelectorAll('.chip.on')].map(b=>b.dataset.tag),clean=$('costumeName').value.trim();if(!clean){$('note').textContent='衣装名を入力してね';return}if(!editing){if(!$('photo').files[0]){$('note').textContent='写真を選択してね';return}return runSave($('save'),async()=>send('/add',{name:clean,tags,image:await imageData($('photo').files[0])}))}const id=Number(editing.id),name='No.'+String(id).padStart(3,'0')+'｜'+clean,file=$('photo').files[0];if(file&&!confirm('写真も差し替えます。よろしいですか？'))return;return runSave($('save'),async()=>{if(file){const image=await imageData(file);const replaced=await send('/replace',{id,image});try{const updated=await send('/update',{id,name,tags});return updated}catch(e){throw Error('写真は保存されましたが、名前・タグの保存に失敗しました：'+e.message)}}return send('/update',{id,name,tags})})};

$('loginForm').onsubmit=async e=>{e.preventDefault();const password=$('loginPassword').value,button=$('loginBtn');button.disabled=true;button.textContent='確認中…';$('loginNote').textContent='パスワードを確認しています';try{const response=await fetch(API+'/auth',{method:'POST',headers:{'X-Admin-Password':password}});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||'ログインできませんでした');sessionPassword=password;$('loginPassword').value='';$('login').classList.add('off')}catch(error){$('loginNote').textContent='ログイン失敗：'+error.message}finally{button.disabled=false;button.textContent='ログイン'}};
$('logout').onclick=()=>{sessionPassword='';$('sheet').classList.remove('on');$('loginNote').textContent='ログアウトしました。';$('login').classList.remove('off')};
</script></body></html>
